name: Build Windows Package (Ai TT出差助手)

on:
  push:
    branches: [main, master, release, v0.2.50-v3]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Rust (MSVC)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable-x86_64-pc-windows-msvc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch Companion Browser Runtime
        run: python scripts/fetch-browser.py

      - name: Build Windows NSIS Installer
        run: bun run tauri build --bundles nsis --features custom-protocol

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AiTT-Travel-Assistant-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
